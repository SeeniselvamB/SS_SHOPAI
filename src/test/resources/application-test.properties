# Isolated in-memory H2 instance for tests — never touches the dev file-based DB
spring.datasource.url=jdbc:h2:mem:shopai_test_db;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=TestOnlySecretKeyForShopAiJwtSigningInTestEnvironment1234567890
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

app.admin.default-email=admin@shopai.com
app.admin.default-password=Admin@123
app.admin.default-name=Super Admin

app.cors.allowed-origins=http://localhost:3000

logging.level.org.springframework.security=WARN
logging.level.com.ss.shopai=INFO