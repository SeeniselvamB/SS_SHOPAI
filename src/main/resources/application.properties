# ===============================
# Application
# ===============================
spring.application.name=ss-shopai

# ===============================
# Database (H2 file-based, zero external setup required)
# To switch to MySQL, comment the H2 block and uncomment the MySQL block below.
# ===============================
# spring.datasource.url=jdbc:h2:file:./data/shopaidb;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# --- MySQL alternative ---
# spring.datasource.url=jdbc:mysql://localhost:3306/ss_shopai?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.url=jdbc:mysql://localhost:3306/ss_shopai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Selvam@123

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Server
# ===============================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ===============================
# JWT
# ===============================
app.jwt.secret=ThisIsAVeryLongSecretKeyForShopAiJwtSigningPurposesChangeMeInProd123456
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ===============================
# Admin bootstrap (used in Part 10 seed data)
# ===============================
app.admin.default-email=admin@shopai.com
app.admin.default-password=Admin@123
app.admin.default-name=Super Admin

# ===============================
# CORS (prepared for future frontend / voice agent integration)
# ===============================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.ss.shopai=DEBUG


# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none